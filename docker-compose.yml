# docker compose up              -> API + UI on http://localhost:8000 (in-memory index, fake provider)
# docker compose --profile pg up -> adds Postgres + pgvector (set VECTOR_STORE=pgvector)
# docker compose --profile redis up -> adds Redis for the answer cache (set REDIS_URL)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VECTOR_STORE: ${VECTOR_STORE:-memory}
      PG_DSN: postgresql://rag:rag@postgres:5432/rag
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - ./traces:/app/traces
      - ./data/index:/app/data/index

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["pg"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  pgdata:
