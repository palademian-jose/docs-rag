name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: fake
  VECTOR_STORE: memory

# `llm-evalops` is a path dependency (`../llm-evalops`, see [tool.uv.sources] in pyproject.toml).
# actions/checkout cannot write outside $GITHUB_WORKSPACE, so both repos are checked out side by
# side inside it (docs-rag/ and llm-evalops/) and every step runs from docs-rag/. The sibling
# repo must be public; if it is private, add a read-only token as the EVALOPS_TOKEN secret.
defaults:
  run:
    working-directory: docs-rag

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs-rag
      - uses: actions/checkout@v4
        with:
          repository: palademian-jose/llm-evalops
          path: llm-evalops
          token: ${{ secrets.EVALOPS_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: docs-rag/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs-rag
      - uses: actions/checkout@v4
        with:
          repository: palademian-jose/llm-evalops
          path: llm-evalops
          token: ${{ secrets.EVALOPS_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: docs-rag/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      # The full golden set, not a subset: reports/baseline.json is a full-set run, and rate
      # metrics such as hallucination move with the refusal/answer mix of a subset.
      - name: Evaluate (fake provider, full golden set)
        run: uv run python scripts/eval.py --mode all --out reports
      - name: Regression gate
        run: |
          uv run evalkit gate \
            --baseline reports/baseline.json \
            --candidate reports/eval-latest.json \
            --config evals.yaml \
            --md reports/gate.md \
            --annotate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: docs-rag/reports/
