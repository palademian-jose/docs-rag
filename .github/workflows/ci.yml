name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: fake
  VECTOR_STORE: memory

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Evaluate (fake provider, subset)
        run: uv run python scripts/eval.py --mode all --limit 40 --out reports
      - name: Regression gate
        run: |
          uv run python scripts/gate.py \
            --baseline reports/baseline.json \
            --candidate reports/eval-latest.json \
            --config evals.yaml \
            --out reports/gate.md
      - name: Gate summary
        if: always()
        run: cat reports/gate.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
